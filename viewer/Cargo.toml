[package]
name = "reda-viewer"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings that expose reda's redstone simulator to a browser viewer"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
reda = { path = ".." }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dev-dependencies]
